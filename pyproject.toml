[project]
name = "q3tui"
version = "0.1.0"
description = "Multi-agent platform for chip design and verification, built on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "pytest>=8.0",  # runs the golden model's self-tests
    "click>=8.1",
    "jsonschema>=4.0",  # VLSIT flow artifacts are validated against their JSON Schemas
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyslang>=9.0",
    "rich>=13.0",
    "textual>=8.2.8",
    "termaid>=0.9",
]

[project.scripts]
q3tui = "q3tui.core.cli:run_cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q3tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
